[package]
name = "return-echo"
version = "0.1.0"
description = "Test program: copies instruction data into return data"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "return_echo"

[features]
# `entrypoint!` checks these. CI sets `-D warnings`, so they must be real features.
custom-heap = []
custom-panic = []

[dependencies]
solana-program = "=3.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

# Own workspace so the root `cargo build-sbf -p ifx` does not require this .so.
[workspace]
