[package]
name = "ifx"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "ifx"

[features]
default = ["no-idl"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
# `Expr` uses custom `IdlBuild` (see `state/expr_idl.rs`); other types still auto-generate.
idl-build = ["anchor-lang/idl-build", "dep:serde_json"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.0.2"
borsh = { version = "1.5", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
solana-security-txt = "1.1.1"
spl-token = { version = "9.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "11.0", default-features = false, features = ["no-entrypoint"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
