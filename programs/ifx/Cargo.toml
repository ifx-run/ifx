[package]
name = "ifx"
version = "0.1.1"
description = "Created with Anchor"
edition = "2021"
license = "Apache-2.0"
build = "build.rs"

[lib]
crate-type = ["cdylib", "lib"]
name = "ifx"

[features]
default = ["no-idl"]
# Verifiable deploy / verify-from-repo: pick exactly one cluster feature (see lib.rs declare_id!).
devnet = []
mainnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
# `Expr` uses custom `IdlBuild` (see `state/expr_idl.rs`); other types still auto-generate.
idl-build = ["anchor-lang/idl-build", "dep:serde_json", "ifx-core/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { workspace = true }
borsh = { version = "1.5", features = ["derive"] }
ifx-core = { path = "../../crates/ifx-core", version = "0.1.1", features = ["wire", "anchor-wire", "layout", "structured-cpi"] }
serde_json = { version = "1.0", optional = true }
solana-security-txt = "1.1.1"
spl-token = { workspace = true }
spl-token-2022 = { workspace = true }
solana-stake-interface = { workspace = true }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
