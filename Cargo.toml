[workspace]
members = [
    "crates/ifx-core",
    "rust-sdk",
    "programs/*",
]
resolver = "2"

# solana-verify reads this to pick the verifiable-build Docker image (must match Anchor.toml solana_version).
[workspace.metadata.cli]
solana = "3.1.10"

# Pin Solana crates to match anchor-lang 1.0.2 workspace (see Anchor.toml solana_version).
[workspace.dependencies]
anchor-lang = "1.0.2"
solana-sdk = "3.0.0"
solana-system-interface = "2.0.0"
solana-stake-interface = { version = "2.0.2", features = ["borsh"] }
# Integration tests / RPC (same lower bound as anchor-client 1.0.2; resolves to 3.1.x in lockfile).
solana-client = "3.0.14"
solana-transaction-status-client-types = "3.0.14"
spl-token = { version = "9.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "11.0", default-features = false, features = ["no-entrypoint"] }
spl-token-interface = "2.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
