[toolchain]
anchor_version = "1.0.2"
solana_version = "3.1.10"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
ifx = "ifxLDKXy8Z5Hk4C9rDTnMStFXzRmpGQkGUCHfYWv5zD"

[programs.devnet]
ifx = "ifxdR1RBRCsyXy7eRXGMxc2KEYWhoHSYvpP18yJ5vTc"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npm run pretest && npx ts-mocha -p ./tsconfig.json -t 1000000 --require tests/setup.ts \"tests/**/*.ts\""

[hooks]

[surfpool]
startup_wait = 5000
shutdown_wait = 2000
rpc_port = 8899
host = "127.0.0.1"
slot_time = 400
block_production_mode = "clock"
