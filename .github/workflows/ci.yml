# Ifx CI — matches local maintainer gates: clippy, security:preflight, npm run all:test.
# Anchor.toml: anchor 1.0.2, solana 3.1.10. Integration tests use Surfpool via `anchor test`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: "3.1.10"
  ANCHOR_VERSION: "1.0.2"
  SURFPOOL_VERSION: "1.2.0"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  IFX_CORE_FEATURES: wire,anchor-wire,layout,structured-cpi

jobs:
  rust:
    name: Rust (clippy + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: cargo-rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-rust-${{ runner.os }}-

      - name: cargo clippy (ifx-core, ifx-sdk)
        run: cargo clippy -p ifx-core -p ifx-sdk --all-targets

      - name: cargo test (ifx-core)
        run: cargo test -p ifx-core --features "${{ env.IFX_CORE_FEATURES }}"

      - name: cargo test (ifx-sdk lib)
        run: cargo test -p ifx-sdk --lib

      - name: cargo test (ifx-core doc)
        run: cargo test -p ifx-core --doc

  go:
    name: Go SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go-sdk/go.sum

      - run: go test ./...

  integration:
    name: Build, security preflight, and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go-sdk/go.sum

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
            ~/.avm/
          key: cargo-integration-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-integration-${{ runner.os }}-

      - name: Install Solana CLI
        run: |
          set -euxo pipefail
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor
        run: |
          set -euxo pipefail
          # avm no longer builds on Rust 1.89; install with 1.91 only. Do not use workspace CARGO_TARGET_DIR here.
          unset CARGO_TARGET_DIR
          rustup toolchain install 1.91.0 --profile minimal
          rustup run 1.91.0 cargo install --git https://github.com/solana-foundation/anchor avm --locked --force
          avm install "${ANCHOR_VERSION}"
          avm use "${ANCHOR_VERSION}"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"
          anchor --version

      - name: Install Surfpool CLI
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sL -o /tmp/surfpool.tar.gz \
            "https://github.com/solana-foundation/surfpool/releases/download/v${SURFPOOL_VERSION}/surfpool-linux-x64.tar.gz"
          tar -xzf /tmp/surfpool.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/surfpool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          surfpool -V

      - name: Solana wallet (local tests)
        run: solana-keygen new --no-bip39-passphrase -f -s

      - name: npm install
        run: |
          npm ci
          cd sdk && npm ci

      - name: npm run security:preflight
        run: npm run security:preflight

      - name: npm run all:test
        run: npm run all:test
